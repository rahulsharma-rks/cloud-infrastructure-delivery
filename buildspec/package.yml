version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - python3 -m pip install --user --disable-pip-version-check cfn-lint
      - export PATH="$HOME/.local/bin:$PATH"
  build:
    commands:
      - |
        set -eu

        : "${TEMPLATE_BUCKET:?TEMPLATE_BUCKET is required}"
        : "${AWS_DEFAULT_REGION:?AWS_DEFAULT_REGION is required}"

        echo "Packaging nested CloudFormation templates..."

        aws cloudformation package \
          --template-file templates/root.yaml \
          --s3-bucket "$TEMPLATE_BUCKET" \
          --s3-prefix packaged-templates \
          --output-template-file packaged-root.yaml \
          --region "$AWS_DEFAULT_REGION"

        echo "Checking packaged template exists..."
        test -s packaged-root.yaml

        echo "Linting packaged template..."
        cfn-lint packaged-root.yaml

        echo "Validating packaged template with CloudFormation..."
        aws cloudformation validate-template \
          --template-body file://packaged-root.yaml \
          --region "$AWS_DEFAULT_REGION"

        echo "Packaging and validation completed successfully."

artifacts:
  files:
    - packaged-root.yaml
    - parameters/dev.json
    - scripts/smoke-test.sh
    - buildspec/smoke-test.yml
